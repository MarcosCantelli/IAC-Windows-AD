---
# Inventário para rodar o Ansible da SUA máquina (ex: refazer só o join
# com --tags ad). O pipeline não usa este arquivo: o Jenkins grava o
# inventory/generated.json a partir do output ansible_inventory do Terraform.
#
# Credenciais vêm de variáveis de ambiente (ver group_vars/windows.yml):
#   export WIN_ADMIN_USR='usuario-admin-local'
#   export WIN_ADMIN_PSW='...'
#   export AD_JOIN_PASSWORD='...'
all:
  children:
    windows:
      hosts:
        Win11_AD-01:
          # IP DHCP da rede de provisionamento:
          #   terraform output -json vms_dhcp_ips
          # ansible_host: 192.168.31.X
          static_ip: "172.16.0.50"
          ad_prefix_length: 24
