---
- name: Configurar VM Windows
  hosts: app_servers
  gather_facts: true

  pre_tasks:

    - name: Aguardar o WinRM ficar disponível na VM Windows
      win_ping:
      register: result
      until: result is success
      retries: 30
      delay: 10

  roles:
  - network
  - base
  - java
  - nodejs
  - python
  - devtools