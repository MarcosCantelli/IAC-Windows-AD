---
# 1. Altera o nome do computador primeiro (Com a rede DHCP original ativa, sem risco de perder o WinRM)
- name: Garantir que o nome do computador e unico antes de mexer na rede
  ansible.windows.win_hostname:
    name: "VDI-W11-{{ static_ip.split('.')[-1] }}"
  register: hostname_change

# 2. Se o nome mudou, reinicia a máquina
- name: Reiniciar para aplicar o novo nome de computador
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when: hostname_change.reboot_required

# 3. ABORDAGEM NOVA: Desativa a rede temporária (DHCP) AGORA para isolar o Windows 11
- name: Desativar a interface antiga VM Network (DHCP) para evitar conflitos de rota
  ansible.windows.win_shell: |
    Disable-NetAdapter -Name "{{ vm_network_interface_name }}" -Confirm:$false

# 4. Configura o IP Estático e DNS na única interface que sobrou (A do AD)
- name: Configurar IP estatico e DNS na interface do AD isolada
  ansible.windows.win_shell: |
    # Remove qualquer resquício de configuração dinâmica ou estática anterior
    Remove-NetIPAddress -InterfaceAlias "{{ ad_interface_name }}" -Confirm:$false -ErrorAction SilentlyContinue
    
    # Seta o IP Estático e o Gateway do AD
    New-NetIPAddress -InterfaceAlias "{{ ad_interface_name }}" -IPAddress "{{ static_ip }}" -PrefixLength 16 -DefaultGateway "{{ ad_gateway }}"
    
    # Seta o DNS apontando estritamente para o Domain Controller
    Set-DnsClientServerAddress -InterfaceAlias "{{ ad_interface_name }}" -ServerAddresses ("{{ ad_dns_primary }}")
    
    # Limpa o cache para garantir consulta limpa
    Clear-DnsClientCache
  async: 60
  poll: 0

# 5. Aguarda o WinRM responder no novo IP estático (Como a placa DHCP morreu, o Ansible chaveia automaticamente para o static_ip se configurado no inventário)
- name: Aguardar o WinRM estabilizar no novo IP estatico
  ansible.windows.win_ping:
  retries: 10
  delay: 10

# 6. Ingressar a VM no domínio corporativo (Agora sem concorrência de DNS!)
- name: Ingressar a VM no dominio mvrc.local
  microsoft.ad.membership:
    dns_domain_name: "mvrc.local"
    domain_admin_user: "ansible@mvrc.local"
    domain_admin_password: "{{ domain_password }}"
    state: domain
  register: domain_join
  notify: Reiniciar Windows pós-domain-join

# 7. Reiniciar final para consolidar o ingresso no Domínio
- name: Reiniciar a VM para aplicar o ingresso no dominio
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when: domain_join.reboot_required