---
# 1. Aplicar a configuração de rede estática na interface do AD usando PowerShell moderno
- name: Configurar IP estatico e Mascara na interface do AD
  ansible.windows.win_shell: |
    $interface = Get-NetAdapter -Name "{{ ad_interface_name }}" -ErrorAction SilentlyContinue
    if ($interface) {
        # Limpa IPs estáticos anteriores na placa para evitar conflitos de escopo
        Remove-NetIPAddress -InterfaceAlias "{{ ad_interface_name }}" -Confirm:$false -ErrorAction SilentlyContinue
        
        # Aplica o novo IP Estático, Máscara (PrefixLength 16 = 255.255.0.0) e Gateway de forma nativa
        New-NetIPAddress -InterfaceAlias "{{ ad_interface_name }}" -IPAddress "{{ static_ip }}" -PrefixLength 16 -DefaultGateway "{{ ad_gateway }}"
    } else {
        Write-Error "A interface de rede '{{ ad_interface_name }}' nao foi encontrada no Windows 11."
        exit 1
    }
  async: 30
  poll: 0

# 2. Configurar o servidor DNS Primário usando PowerShell Nativo (Remove a dependência do community.windows)
- name: Configurar DNS Primario na interface do AD
  ansible.windows.win_shell: |
    Set-DnsClientServerAddress -InterfaceAlias "{{ ad_interface_name }}" -ServerAddresses ("{{ ad_dns_primary }}", "8.8.8.8")

# 3. Pequena pausa para a tabela de roteamento do Windows 11 se estabilizar pós-troca de IP/DNS
- name: Aguardar estabilizacao da nova rota de rede
  ansible.windows.win_ping:
  retries: 5
  delay: 5

# 4. Ingressar a VM no domínio corporativo usando o usuário ansible do AD
- name: Ingressar a VM no dominio mvrc.local
  microsoft.ad.membership:
    dns_domain_name: "mvrc.local"
    domain_admin_user: "ansible@mvrc.local"
    domain_admin_password: "{{ domain_password }}"
    state: domain
  register: domain_join
  notify: Reiniciar Windows pós-domain-join

# 5. Reiniciar a VM para consolidar a alteração do Domínio
- name: Reiniciar a VM para aplicar alteracoes de rede e dominio
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when: domain_join.reboot_required

# 6. Excluir/Desativar o adaptador de rede temporário (VM Network)
- name: Desativar a interface antiga VM Network (DHCP)
  ansible.windows.win_shell: |
    Disable-NetAdapter -Name "{{ vm_network_interface_name }}" -Confirm:$false