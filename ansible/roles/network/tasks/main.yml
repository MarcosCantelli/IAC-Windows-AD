---
# 1. Altera o hostname primeiro
- name: Garantir que o nome do computador seja unico antes de mexer na rede
  ansible.windows.win_hostname:
    name: "VDI-W11-{{ static_ip.split('.')[-1] }}"
  register: hostname_change

# 2. Reinicia caso necessário
- name: Reiniciar para aplicar o novo nome de computador
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when: hostname_change.reboot_required

# 3. Descobre automaticamente a interface DHCP
- name: Descobrir interface DHCP ativa
  ansible.windows.win_shell: |
    $adapter = Get-NetIPInterface -AddressFamily IPv4 |
      Where-Object {
        $_.Dhcp -eq "Enabled" -and
        $_.ConnectionState -eq "Connected"
      } |
      Select-Object -First 1 -ExpandProperty InterfaceAlias

    Write-Output $adapter
  register: dhcp_adapter

# 4. Exibe interface encontrada
- name: Exibir interface DHCP encontrada
  debug:
    msg: "{{ dhcp_adapter.stdout | trim }}"

# 5. Desativa interface DHCP
- name: Desativar interface antiga DHCP para evitar conflito de rota
  ansible.windows.win_shell: |
    Disable-NetAdapter -Name "{{ dhcp_adapter.stdout | trim }}" -Confirm:$false
  when:
    - dhcp_adapter.stdout is defined
    - dhcp_adapter.stdout | trim != ""

# 6. Configura IP estático
- name: Configurar IP estatico e DNS na interface do AD
  ansible.windows.win_shell: |
    $interface = "{{ ad_interface_name }}"

    # Remove IPs antigos
    Get-NetIPAddress -InterfaceAlias $interface -AddressFamily IPv4 -ErrorAction SilentlyContinue |
      Remove-NetIPAddress -Confirm:$false -ErrorAction SilentlyContinue

    # Remove rotas antigas
    Get-NetRoute -InterfaceAlias $interface -AddressFamily IPv4 -ErrorAction SilentlyContinue |
      Remove-NetRoute -Confirm:$false -ErrorAction SilentlyContinue

    # Configura IP estático
    New-NetIPAddress `
      -InterfaceAlias $interface `
      -IPAddress "{{ static_ip }}" `
      -PrefixLength 16 `
      -DefaultGateway "{{ ad_gateway }}"

    # Configura DNS
    Set-DnsClientServerAddress `
      -InterfaceAlias $interface `
      -ServerAddresses ("{{ ad_dns_primary }}")

    # Limpa cache DNS
    Clear-DnsClientCache
  async: 60
  poll: 0

# 7. Aguarda WinRM estabilizar
- name: Aguardar WinRM estabilizar no novo IP estatico
  ansible.windows.win_ping:
  retries: 15
  delay: 10

# 8. Ingressa no domínio
- name: Ingressar a VM no dominio mvrc.local
  microsoft.ad.membership:
    dns_domain_name: "mvrc.local"
    domain_admin_user: "ansible@mvrc.local"
    domain_admin_password: "{{ domain_password }}"
    state: domain
  register: domain_join
  notify: Reiniciar Windows pós-domain-join

# 9. Reinicialização final
- name: Reiniciar a VM para aplicar o ingresso no dominio
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when: domain_join.reboot_required