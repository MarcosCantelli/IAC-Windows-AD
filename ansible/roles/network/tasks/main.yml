---
# 1. Configura o hostname, IP Estático, Máscara, Gateway e DNS juntos
- name: Configurar IP estatico, Mascara, DNS e Nome da VM no Windows
  ansible.windows.win_shell: |
    $interface = Get-NetAdapter -Name "{{ ad_interface_name }}" -ErrorAction SilentlyContinue
    if ($interface) {
        # A) Remove IPs antigos da placa para evitar conflitos de escopo
        Remove-NetIPAddress -InterfaceAlias "{{ ad_interface_name }}" -Confirm:$false -ErrorAction SilentlyContinue
        
        # B) Aplica o novo IP Estático, Máscara e Gateway
        New-NetIPAddress -InterfaceAlias "{{ ad_interface_name }}" -IPAddress "{{ static_ip }}" -PrefixLength 16 -DefaultGateway "{{ ad_gateway }}" -ErrorAction SilentlyContinue
        
        # C) Define os servidores de DNS na placa do AD
        Set-DnsClientServerAddress -InterfaceAlias "{{ ad_interface_name }}" -ServerAddresses ("{{ ad_dns_primary }}", "8.8.8.8")
        
        # D) CORREÇÃO: Limpa o cache de DNS do Windows 11 para forçar a busca do AD no IP novo
        Clear-DnsClientCache
    } else {
        Write-Error "A interface de rede '{{ ad_interface_name }}' nao foi encontrada."
        exit 1
    }
  async: 60
  poll: 0

# 2. Aguarda a placa de rede atualizar no vSphere e responder ao teste do Ansible
- name: Aguardar a rede e rotas do Windows estabilizarem
  ansible.windows.win_ping:
  retries: 6
  delay: 10

# 3. CORREÇÃO: Altera o nome do computador para evitar o conflito de 'VM-TEMPLATE' no AD
# Usamos o final do IP Estático para gerar um nome único (Ex: VDI-Win11-1)
- name: Garantir que o nome do computador e unico antes do Domain Join
  ansible.windows.win_hostname:
    name: "VDI-W11-{{ static_ip.split('.')[-1] }}"
  register: hostname_change

# 4. Caso o nome tenha mudado, precisamos reiniciar para o Windows aplicar o novo SID local
- name: Reiniciar para aplicar o novo nome de computador se necessario
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when: hostname_change.reboot_required

# 5. Ingressar a VM no domínio corporativo usando o usuário ansible do AD
- name: Ingressar a VM no dominio mvrc.local
  microsoft.ad.membership:
    dns_domain_name: "mvrc.local"
    domain_admin_user: "ansible@mvrc.local"
    domain_admin_password: "{{ domain_password }}"
    state: domain
  register: domain_join
  notify: Reiniciar Windows pós-domain-join

# 6. Reiniciar a VM para consolidar a alteração do Domínio
- name: Reiniciar a VM para aplicar alteracoes de rede e dominio
  ansible.windows.win_reboot:
    reboot_timeout: 300
  when: domain_join.reboot_required

# 7. Excluir/Desativar o adaptador de rede temporário (VM Network)
- name: Desativar a interface antiga VM Network (DHCP)
  ansible.windows.win_shell: |
    Disable-NetAdapter -Name "{{ vm_network_interface_name }}" -Confirm:$false