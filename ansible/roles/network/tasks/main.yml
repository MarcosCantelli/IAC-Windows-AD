---
# 1. Aplicar a configuração de rede estática na interface do AD
- name: Configurar IP estatico e Mascara na interface do AD
  win_shell: |
    netsh interface ipv4 set address name="{{ ad_interface_name }}" static "{{ static_ip }}" "{{ ad_netmask }}" "{{ ad_gateway }}"
  async: 30
  poll: 5

# 2. Configurar o servidor DNS Primário (Seu Active Directory)
- name: Configurar DNS Primario na interface do AD
  win_dns_client:
    adapter_names: "{{ ad_interface_name }}"
    ipv4_addresses:
      - "{{ ad_dns_primary }}"
      - "8.8.8.8"

# 3. Validar se a comunicação interna está respondendo pelo novo IP estático
- name: Validar conectividade com o Controlador de Dominio (AD)
  win_ping:

# 4. Ingressar a VM no domínio corporativo usando o usuário ansible do AD
- name: Ingressar a VM no dominio mvrc.local
  win_domain_membership:
    dns_domain_name: "mvrc.local"
    domain_admin_user: "ansible@mvrc.local"
    domain_admin_password: "{{ domain_password }}" # Injetado com segurança pelo Jenkins
    state: domain
  register: domain_join

# 5. Reiniciar a VM para consolidar a alteração do Domínio
- name: Reiniciar a VM para aplicar alteracoes de rede e dominio
  win_reboot:
    reboot_timeout: 300
  when: domain_join.reboot_required

# 6. Excluir/Desativar o adaptador de rede temporário (VM Network)
# Como sua rede do AD tem DHCP ativo distribuindo internet, a máquina continuará conectada à rede externa por ela.
- name: Desativar a interface antiga VM Network (DHCP)
  win_shell: |
    Disable-NetAdapter -Name "{{ vm_network_interface_name }}" -Confirm:$false