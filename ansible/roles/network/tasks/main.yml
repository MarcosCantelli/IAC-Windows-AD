---
#########################################################################
# HOSTNAME
#########################################################################

- name: Definir hostname único
  ansible.windows.win_hostname:
    name: "VDI-W11-{{ static_ip.split('.')[-1] }}"
  register: hostname_change

- name: Reiniciar após alteração hostname
  ansible.windows.win_reboot:
    reboot_timeout: 600
  when: hostname_change.reboot_required

#########################################################################
# DESCOBRIR NIC DHCP
#########################################################################

- name: Descobrir interface DHCP ativa
  ansible.windows.win_shell: |
    Get-NetIPConfiguration |
    Where-Object {
      $_.IPv4DefaultGateway -ne $null -and
      $_.NetAdapter.Status -eq "Up"
    } |
    Select-Object -First 1 -ExpandProperty InterfaceAlias
  register: dhcp_adapter

- name: Normalizar interface DHCP
  set_fact:
    dhcp_interface_name: "{{ dhcp_adapter.stdout | trim }}"

- name: Mostrar interface DHCP
  debug:
    msg: "{{ dhcp_interface_name }}"

#########################################################################
# DESCOBRIR NIC AD
#########################################################################

- name: Descobrir interface AD
  ansible.windows.win_shell: |
    Get-NetAdapter |
    Where-Object {
      $_.Status -eq "Up" -and
      $_.Name -ne "{{ dhcp_interface_name }}"
    } |
    Select-Object -First 1 -ExpandProperty Name
  register: ad_adapter

- name: Normalizar interface AD
  set_fact:
    ad_interface_real: "{{ ad_adapter.stdout | trim }}"

- name: Mostrar interface AD
  debug:
    msg: "{{ ad_interface_real }}"

#########################################################################
# CONFIGURAR NIC AD
#########################################################################

- name: Configurar IP estático na NIC AD
  ansible.windows.win_shell: |

    $iface = "{{ ad_interface_real }}"

    # Remove IPs antigos
    Get-NetIPAddress `
      -InterfaceAlias $iface `
      -AddressFamily IPv4 `
      -ErrorAction SilentlyContinue |
      Remove-NetIPAddress `
        -Confirm:$false `
        -ErrorAction SilentlyContinue

    # Remove gateways antigos
    Get-NetRoute `
      -InterfaceAlias $iface `
      -ErrorAction SilentlyContinue |
      Remove-NetRoute `
        -Confirm:$false `
        -ErrorAction SilentlyContinue

    # Configura IP
    New-NetIPAddress `
      -InterfaceAlias $iface `
      -IPAddress "{{ static_ip }}" `
      -PrefixLength {{ ad_prefix_length }} `
      -DefaultGateway "{{ ad_gateway }}"

    # Configura DNS AD
    Set-DnsClientServerAddress `
      -InterfaceAlias $iface `
      -ServerAddresses ("{{ ad_dns_primary }}")

    # Define sufixo DNS
    Set-DnsClient `
      -InterfaceAlias $iface `
      -ConnectionSpecificSuffix "{{ company_domain }}"

    # Limpa cache
    Clear-DnsClientCache

#########################################################################
# GARANTIR PERFIL PRIVATE
#########################################################################

- name: Definir perfil de rede como Private
  ansible.windows.win_shell: |
    Get-NetConnectionProfile |
    Set-NetConnectionProfile -NetworkCategory Private

#########################################################################
# GARANTIR WINRM
#########################################################################

- name: Habilitar PS Remoting
  ansible.windows.win_shell: |
    Enable-PSRemoting -Force

- name: Garantir serviço WinRM iniciado
  ansible.windows.win_service:
    name: WinRM
    start_mode: auto
    state: started

- name: Abrir firewall WinRM HTTPS 5986
  ansible.windows.win_shell: |
    netsh advfirewall firewall add rule `
      name="WinRM HTTPS 5986" `
      dir=in `
      action=allow `
      protocol=TCP `
      localport=5986
  ignore_errors: true

- name: Validar listener WinRM
  ansible.windows.win_shell: |
    winrm enumerate winrm/config/listener
  register: winrm_listener

- name: Exibir listener WinRM
  debug:
    var: winrm_listener.stdout

#########################################################################
# AGUARDAR REDE
#########################################################################

- name: Aguardar rede estabilizar
  pause:
    seconds: 20

#########################################################################
# VALIDAR DNS
#########################################################################

- name: Validar resolução do domínio
  ansible.windows.win_shell: |
    Resolve-DnsName {{ company_domain }}
  register: dns_test

- name: Exibir resultado DNS
  debug:
    var: dns_test.stdout

#########################################################################
# VALIDAR DOMAIN CONTROLLER
#########################################################################

- name: Testar comunicação com Domain Controller
  ansible.windows.win_shell: |
    Test-NetConnection {{ ad_dns_primary }} -Port 53
  register: dc_test

- name: Exibir teste DC
  debug:
    var: dc_test.stdout

#########################################################################
# VALIDAR LDAP
#########################################################################

- name: Testar LDAP
  ansible.windows.win_shell: |
    Test-NetConnection {{ ad_dns_primary }} -Port 389
  register: ldap_test

- name: Exibir teste LDAP
  debug:
    var: ldap_test.stdout

#########################################################################
# DOMAIN JOIN
#########################################################################

- name: Ingressar VM no domínio
  microsoft.ad.membership:
    dns_domain_name: "{{ company_domain }}"
    hostname: "VDI-W11-{{ static_ip.split('.')[-1] }}"
    domain_admin_user: "ansible@{{ company_domain }}"
    domain_admin_password: "{{ domain_password }}"
    state: domain
    reboot: true
  register: domain_join

#########################################################################
# AGUARDAR REBOOT DOMAIN JOIN
#########################################################################

- name: Aguardar retorno WinRM pós-domain
  ansible.windows.win_ping:
  register: winrm_result
  until: winrm_result is success
  retries: 30
  delay: 20

#########################################################################
# DESATIVAR NIC DHCP SOMENTE NO FINAL
#########################################################################

- name: Desativar NIC DHCP antiga
  ansible.windows.win_shell: |
    Disable-NetAdapter `
      -Name "{{ dhcp_interface_name }}" `
      -Confirm:$false
  ignore_errors: true

#########################################################################
# RESTART FINAL REDE
#########################################################################

- name: Reiniciar adaptador AD
  ansible.windows.win_shell: |
    Restart-NetAdapter -Name "{{ ad_interface_real }}"
  ignore_errors: true

#########################################################################
# VALIDAR IP FINAL
#########################################################################

- name: Exibir configuração final
  ansible.windows.win_shell: |
    ipconfig /all
  register: final_ipconfig

- name: Exibir ipconfig final
  debug:
    var: final_ipconfig.stdout

#########################################################################
# VALIDAR DOMÍNIO
#########################################################################

- name: Validar ingresso no domínio
  ansible.windows.win_shell: |
    (Get-WmiObject Win32_ComputerSystem).Domain
  register: domain_validation

- name: Exibir domínio final
  debug:
    var: domain_validation.stdout