---
#########################################################################
# DISCO D:\ PROGRAMAS
#########################################################################

- name: Garantir que o segundo disco esteja online
  ansible.windows.win_powershell:
    script: |
      $disk = Get-Disk -Number 1 -ErrorAction SilentlyContinue

      if ($disk -and $disk.IsOffline) {
          Set-Disk -Number 1 -IsOffline $false
      }
  ignore_errors: true

- name: Inicializar disco caso esteja RAW
  ansible.windows.win_powershell:
    script: |
      $disk = Get-Disk -Number 1

      if ($disk.PartitionStyle -eq 'RAW') {
          Initialize-Disk -Number 1 -PartitionStyle GPT
      }

- name: Criar partição D: ocupando todo o disco
  community.windows.win_partition:
    drive_letter: D
    disk_number: 1
    partition_size: -1
    state: present

- name: Formatar volume D: em NTFS
  community.windows.win_format:
    drive_letter: D
    file_system: NTFS
    new_label: Programas
    state: present

- name: Criar diretório raiz de programas
  ansible.windows.win_file:
    path: "{{ programs_root }}"
    state: directory

#########################################################################
# CONFIGURAÇÕES WINDOWS BASE
#########################################################################

- name: Configurar LocalAccountTokenFilterPolicy
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: LocalAccountTokenFilterPolicy
    data: 1
    type: dword
    state: present

- name: Desabilitar UAC remoto restritivo
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: EnableLUA
    data: 1
    type: dword
    state: present

#########################################################################
# POWERSHELL 7
#########################################################################

- name: Garantir instalação do PowerShell 7
  chocolatey.chocolatey.win_chocolatey:
    name: powershell-core
    state: present

#########################################################################
# CHOCOLATEY
#########################################################################

- name: Garantir Chocolatey instalado
  chocolatey.chocolatey.win_chocolatey:
    name: chocolatey
    state: present

- name: Habilitar uso global do Chocolatey
  ansible.windows.win_shell: |
    choco feature enable -n allowGlobalConfirmation
  changed_when: false

#########################################################################
# FERRAMENTAS BASE
#########################################################################

- name: Instalar 7zip
  chocolatey.chocolatey.win_chocolatey:
    name: 7zip
    state: present

- name: Instalar Git
  chocolatey.chocolatey.win_chocolatey:
    name: git
    state: present

- name: Instalar Firefox
  chocolatey.chocolatey.win_chocolatey:
    name: firefox
    state: present

- name: Instalar Visual Studio Code
  chocolatey.chocolatey.win_chocolatey:
    name: vscode
    state: present

#########################################################################
# WINDOWS FEATURES IMPORTANTES
#########################################################################

- name: Instalar .NET Framework 4.8
  chocolatey.chocolatey.win_chocolatey:
    name: dotnetfx
    state: present

#########################################################################
# AJUSTES DE EXECUÇÃO
#########################################################################

- name: Garantir política RemoteSigned no PowerShell
  ansible.windows.win_shell: |
    Set-ExecutionPolicy RemoteSigned -Force
  changed_when: false

#########################################################################
# PATH D:\Programas
#########################################################################

- name: Garantir diretório Tools
  ansible.windows.win_file:
    path: "{{ programs_root }}\\Tools"
    state: directory

#########################################################################
# WINRM ESTÁVEL
#########################################################################

- name: Reiniciar serviço WinRM
  ansible.windows.win_service:
    name: WinRM
    state: restarted

#########################################################################
# INFORMAÇÕES FINAIS
#########################################################################

- name: Exibir resumo do bootstrap base
  ansible.windows.win_debug:
    msg:
      - "Bootstrap base concluído"
      - "Programas instalados em: {{ programs_root }}"
      - "Chocolatey operacional"
      - "PowerShell 7 instalado"
      - "Ferramentas base instaladas"