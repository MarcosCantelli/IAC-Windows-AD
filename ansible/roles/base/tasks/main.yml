---
#########################################################################
# DISCO D:
#########################################################################

- name: Garantir que o segundo disco esteja online
  ansible.windows.win_powershell:
    script: |
      $disk = Get-Disk -Number 1 -ErrorAction SilentlyContinue

      if ($disk) {
          Set-Disk -Number 1 -IsOffline $false
          Set-Disk -Number 1 -IsReadOnly $false
      }
  ignore_errors: true

#########################################################################
# VALIDAR SE D: JA EXISTE
#########################################################################

- name: Verificar se o drive D ja existe
  ansible.windows.win_shell: |
    Get-PSDrive -Name D -ErrorAction SilentlyContinue
  register: drive_d_exists
  changed_when: false
  failed_when: false

#########################################################################
# CRIAR PARTICAO SOMENTE SE NECESSARIO
#########################################################################

- name: "Criar partição D ocupando todo o disco"
  community.windows.win_partition:
    drive_letter: D
    disk_number: 1
    partition_size: -1
    state: present
  when: drive_d_exists.stdout == ""

#########################################################################
# FORMATAR SOMENTE SE NECESSARIO
#########################################################################

- name: "Formatar drive D como NTFS"
  community.windows.win_format:
    drive_letter: D
    file_system: NTFS
    new_label: Programas
    state: present
  when: drive_d_exists.stdout == ""

#########################################################################
# DIRETORIOS
#########################################################################

- name: "Criar diretório D:\\Programas"
  ansible.windows.win_file:
    path: 'D:\Programas'
    state: directory

- name: "Criar diretório D:\\Programas\\Temp"
  ansible.windows.win_file:
    path: 'D:\Programas\Temp'
    state: directory

- name: "Criar diretório D:\\Programas\\Logs"
  ansible.windows.win_file:
    path: 'D:\Programas\Logs'
    state: directory

#########################################################################
# CHOCOLATEY
#########################################################################

- name: Garantir Chocolatey instalado
  chocolatey.chocolatey.win_chocolatey:
    name: chocolatey
    state: present

#########################################################################
# CONFIGURACOES WINDOWS REMOTE ADMIN
#########################################################################

- name: Configurar LocalAccountTokenFilterPolicy
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: LocalAccountTokenFilterPolicy
    data: 1
    type: dword
    state: present

#########################################################################
# POWERSHELL EXECUTION POLICY
#########################################################################

- name: Configurar Execution Policy
  ansible.windows.win_shell: |
    try {

        Set-ExecutionPolicy `
          -ExecutionPolicy RemoteSigned `
          -Scope LocalMachine `
          -Force

        Write-Output "Execution Policy configurada"

    }
    catch {

        Write-Output "Execution Policy já controlada por GPO"
        exit 0

    }
  register: execution_policy_result
  changed_when: false
  failed_when: false

- name: Exibir status Execution Policy
  debug:
    var: execution_policy_result.stdout

#########################################################################
# HABILITAR LONG PATHS
#########################################################################

- name: Habilitar suporte a Long Paths
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem
    name: LongPathsEnabled
    data: 1
    type: dword
    state: present

#########################################################################
# CONFIGURAR TIMEZONE
#########################################################################

- name: Configurar timezone Brasil
  ansible.windows.win_timezone:
    timezone: "E. South America Standard Time"

#########################################################################
# CONFIGURAR NTP
#########################################################################

- name: Configurar sincronismo NTP
  ansible.windows.win_shell: |
    w32tm /config /syncfromflags:domhier /update
    Restart-Service w32time
  changed_when: false

#########################################################################
# WINDOWS FEATURES IMPORTANTES
#########################################################################

- name: Instalar RSAT AD Tools
  ansible.windows.win_feature:
    name:
      - RSAT-AD-Tools
    state: present
  ignore_errors: true

#########################################################################
# VALIDACOES
#########################################################################

- name: Validar drive D
  ansible.windows.win_shell: |
    Get-Volume -DriveLetter D
  register: drive_validation
  changed_when: false

- name: Exibir validacao do drive D
  debug:
    var: drive_validation.stdout

#########################################################################
# RESUMO FINAL
#########################################################################

- name: Exibir resumo Base
  debug:
    msg:
      - "Drive D preparado com sucesso"
      - "Chocolatey instalado"
      - "Execution Policy configurada"
      - "Timezone Brasil configurado"
      - "Windows preparado para automação"