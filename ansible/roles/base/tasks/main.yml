---
#########################################################################
# DISCO D:
# No OLVM toda VM tem um drive de CD, e o Windows costuma dar o D: para
# ele. A numeração dos discos também depende do controlador (SATA x
# VirtIO-SCSI), então o disco de programas é achado por ser o RAW, não
# pelo número 1.
#########################################################################

- name: Liberar a letra D (move o drive de CD para Z)
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $cd = Get-CimInstance Win32_Volume -Filter "DriveLetter = 'D:' AND DriveType = 5"
      if ($cd) {
        Set-CimInstance -InputObject $cd -Property @{ DriveLetter = 'Z:' }
        $Ansible.Changed = $true
      }

- name: Criar o D (Programas) no disco vazio
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      if (Get-Volume -DriveLetter D -ErrorAction SilentlyContinue) { return }

      $disk = Get-Disk |
        Where-Object { $_.PartitionStyle -eq 'RAW' -and -not $_.IsBoot -and -not $_.IsSystem } |
        Sort-Object Number |
        Select-Object -First 1
      if (-not $disk) {
        throw 'Nenhum disco vazio para virar D:. Confira data_disk_enabled no Terraform e o driver vioscsi (virtio-win) no template.'
      }

      if ($disk.IsOffline) { Set-Disk -Number $disk.Number -IsOffline $false }
      if ($disk.IsReadOnly) { Set-Disk -Number $disk.Number -IsReadOnly $false }

      Initialize-Disk -Number $disk.Number -PartitionStyle GPT
      New-Partition -DiskNumber $disk.Number -UseMaximumSize -DriveLetter D |
        Format-Volume -FileSystem NTFS -NewFileSystemLabel 'Programas' -Confirm:$false |
        Out-Null
      $Ansible.Changed = $true

#########################################################################
# DIRETORIOS
#########################################################################

- name: "Criar diretório D:\\Programas"
  ansible.windows.win_file:
    path: 'D:\Programas'
    state: directory

- name: "Criar diretório D:\\Programas\\Temp"
  ansible.windows.win_file:
    path: 'D:\Programas\Temp'
    state: directory

- name: "Criar diretório D:\\Programas\\Logs"
  ansible.windows.win_file:
    path: 'D:\Programas\Logs'
    state: directory

#########################################################################
# CHOCOLATEY
#########################################################################

- name: Garantir Chocolatey instalado
  chocolatey.chocolatey.win_chocolatey:
    name: chocolatey
    state: present

#########################################################################
# CONFIGURACOES WINDOWS REMOTE ADMIN
#########################################################################

- name: Configurar LocalAccountTokenFilterPolicy
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: LocalAccountTokenFilterPolicy
    data: 1
    type: dword
    state: present

#########################################################################
# POWERSHELL EXECUTION POLICY
#########################################################################

- name: Configurar Execution Policy
  ansible.windows.win_shell: |
    try {

        Set-ExecutionPolicy `
          -ExecutionPolicy RemoteSigned `
          -Scope LocalMachine `
          -Force

        Write-Output "Execution Policy configurada"

    }
    catch {

        Write-Output "Execution Policy já controlada por GPO"
        exit 0

    }
  register: execution_policy_result
  changed_when: false
  failed_when: false

- name: Exibir status Execution Policy
  debug:
    var: execution_policy_result.stdout

#########################################################################
# HABILITAR LONG PATHS
#########################################################################

- name: Habilitar suporte a Long Paths
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem
    name: LongPathsEnabled
    data: 1
    type: dword
    state: present

#########################################################################
# CONFIGURAR TIMEZONE
#########################################################################

- name: Configurar timezone Brasil
  ansible.windows.win_timezone:
    timezone: "E. South America Standard Time"

#########################################################################
# CONFIGURAR NTP
#########################################################################

- name: Configurar sincronismo NTP
  ansible.windows.win_shell: |
    w32tm /config /syncfromflags:domhier /update
    Restart-Service w32time
  changed_when: false

#########################################################################
# WINDOWS FEATURES IMPORTANTES
#########################################################################

- name: Instalar RSAT AD Tools
  ansible.windows.win_feature:
    name:
      - RSAT-AD-Tools
    state: present
  ignore_errors: true

#########################################################################
# VALIDACOES
#########################################################################

- name: Validar drive D
  ansible.windows.win_shell: |
    Get-Volume -DriveLetter D
  register: drive_validation
  changed_when: false

- name: Exibir validacao do drive D
  debug:
    var: drive_validation.stdout

#########################################################################
# RESUMO FINAL
#########################################################################

- name: Exibir resumo Base
  debug:
    msg:
      - "Drive D preparado com sucesso"
      - "Chocolatey instalado"
      - "Execution Policy configurada"
      - "Timezone Brasil configurado"
      - "Windows preparado para automação"